server:
  port: 8088

spring:
  application:
    name: archnova-web
  datasource:
    url: jdbc:mysql://127.0.0.1:3308/archnova?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

archnova:
  jwt-secret: archnova-studio-jwt-secret-key-2026
  jwt-expire-hours: 168
  upload-dir: uploads
