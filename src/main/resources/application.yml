server:
  port: 8088

spring:
  application:
    name: archnova-web
  datasource:
    url: jdbc:mysql://127.0.0.1:3308/archnova?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: admin
    password: admin

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

archnova:
  jwt-secret: archnova-studio-jwt-secret-key-2026
  jwt-expire-hours: 168
  #配置文件存储服务类型，可选配置[local,aliyun,minio,rustfs]
  oss:
    type: aliyun
    accessKey: your-access-key
    secretKey: your-secret-key
    endpoint: oss-cn-beijing.aliyuncs.com
    bucketName: dinenova
    folder: uploads
  order:
    # 待支付订单超时取消，默认 24 小时
    cancel-delay-ms: 86400000
  pay:
    alipay:
      app-id:
      private-key:
      alipay-public-key:
      notify-url:
    wechat:
      app-id:
      mch-id:
      api-v3-key:
      notify-url:
